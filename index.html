<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Triangle Battle Arena</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0b0c10; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    font-family: Helvetica, Arial, sans-serif;
  }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

// ===================== SETUP =====================
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let W = 0, H = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (game && game.touchMode) game.setupJoysticks();
}
window.addEventListener("resize", resize);

// ===================== HELPERS =====================
function triPoints(x, y, r, angle) {
  return [
    [x + Math.cos(angle) * r,       y + Math.sin(angle) * r],
    [x + Math.cos(angle + 2.4) * r, y + Math.sin(angle + 2.4) * r],
    [x + Math.cos(angle - 2.4) * r, y + Math.sin(angle - 2.4) * r],
  ];
}
function drawTri(x, y, r, angle, fill) {
  const p = triPoints(x, y, r, angle);
  ctx.beginPath();
  ctx.moveTo(p[0][0], p[0][1]);
  ctx.lineTo(p[1][0], p[1][1]);
  ctx.lineTo(p[2][0], p[2][1]);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
}
const now = () => performance.now() / 1000;

function drawHpBar(x, y, hp, maxHp, color = "#ff2e63") {
  const bw = 42, bh = 5;
  const bx = x - bw / 2, by = y - 32;
  ctx.fillStyle = "#2b2d42"; ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = color;     ctx.fillRect(bx, by, (bw * hp) / maxHp, bh);
}

// Global speed boost — everything is 1.7x faster than the original
const SPEED_MULT = 1.7;

// ===================== PROJECTILES =====================
class Bullet {
  constructor(x, y, angle, speed = 10, radius = 5, color = "#00fff5", piercing = false) {
    this.x = x; this.y = y;
    this.dx = Math.cos(angle); this.dy = Math.sin(angle);
    this.speed = speed * SPEED_MULT;
    this.radius = radius;
    this.color = color; this.piercing = piercing;
    this.active = true;
    this.lockOnTarget = null;
    this.damageMult = 1;
    this.fromHelper = false;
  }
  update() {
    if (this.lockOnTarget && this.lockOnTarget.isAlive) {
      const d = Math.hypot(this.lockOnTarget.x - this.x, this.lockOnTarget.y - this.y);
      if (d < 140) {
        const ang = Math.atan2(this.lockOnTarget.y - this.y, this.lockOnTarget.x - this.x);
        this.dx = Math.cos(ang); this.dy = Math.sin(ang);
      }
    }
    this.x += this.dx * this.speed; this.y += this.dy * this.speed;
    if (this.x < -20 || this.x > W + 20 || this.y < -20 || this.y > H + 20) this.active = false;
  }
  draw() {
    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = this.color; ctx.fill();
  }
}

class StrongBullet {
  constructor(x, y, angle) {
    this.x = x; this.y = y;
    this.dx = Math.cos(angle); this.dy = Math.sin(angle);
    this.speed = 17 * SPEED_MULT;
    this.radius = 14;
    this.active = true;
    this.lockOnTarget = null;
    this.damageMult = 1;
    this.fromHelper = false;
  }
  update() {
    if (this.lockOnTarget && this.lockOnTarget.isAlive) {
      const d = Math.hypot(this.lockOnTarget.x - this.x, this.lockOnTarget.y - this.y);
      if (d < 140) {
        const ang = Math.atan2(this.lockOnTarget.y - this.y, this.lockOnTarget.x - this.x);
        this.dx = Math.cos(ang); this.dy = Math.sin(ang);
      }
    }
    this.x += this.dx * this.speed; this.y += this.dy * this.speed;
    if (this.x < -30 || this.x > W + 30 || this.y < -30 || this.y > H + 30) this.active = false;
  }
  draw() {
    const r = this.radius;
    ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.fillStyle = this.fromHelper ? "#bbbbbb" : "#ff2e63"; ctx.fill();
    ctx.beginPath(); ctx.arc(this.x, this.y, r / 2, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff"; ctx.fill();
  }
}

class Rocket {
  constructor(x, y, target, speed = 6.5, color = "#ff9f43", fromHelper = false) {
    this.x = x; this.y = y;
    this.radius = 7; this.size = 8;
    this.speed = speed * SPEED_MULT;
    this.color = color;
    this.spawnTime = now();
    this.lifetime = 2.0;
    this.maxTurnRate = 0.08;
    this.target = target;
    this.active = true;
    this.angle = target ? Math.atan2(target.y - y, target.x - x) : 0;
    this.damage = 1;
    this.fromHelper = fromHelper;
  }
  update() {
    const elapsed = now() - this.spawnTime;
    if (elapsed > this.lifetime) { this.active = false; return; }
    if (this.target && this.target.isAlive) {
      const desired = Math.atan2(this.target.y - this.y, this.target.x - this.x);
      let diff = desired - this.angle;
      while (diff >  Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      const turn = Math.max(-this.maxTurnRate, Math.min(this.maxTurnRate, diff));
      this.angle += turn;
    }
    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;
    if (this.x < 5 || this.x > W - 5 || this.y < 5 || this.y > H - 5) this.active = false;
  }
  draw() { drawTri(this.x, this.y, this.size, this.angle, this.color); }
}

// ===================== PLAYER =====================
class PlayerRed {
  constructor(x, y, hp = 20) {
    this.x = x; this.y = y;
    this.radius = 18;
    this.baseSpeed = 5.8 * SPEED_MULT;
    this.angle = 0;
    this.maxHp = hp; this.hp = hp;
    this.isAlive = true;
    this.score = 0;
    this.kills = 0;
    this.strongBulletCd = 20; this.lastStrongBulletTime = -20;
    this.rocketCd = 3;        this.lastRocketTime = -3;
    this.dashCd = 4;          this.lastDashTime = -4;
    this.dashEndTime = 0;

    this.equipped = [];

    this.shieldHp = 0;
    this.shieldMax = 10;
    this.shieldCd = 30;
    this.shieldLastUsed = -30;

    this.strikePending = false;
    this.isStriking = false;
    this.strikeDir = [1, 0];
    this.strikeTrail = [];
    this.strikeCd = 15;
    this.strikeLastUsed = -15;

    this.lockonActive = false;
    this.lockonSelecting = false;
    this.lockonPath = [];
    this.lockonCircles = [];        // { x, y, r, expire }
    this.lockonLocked = new Set();  // enemies locked forever
    this.lockonCd = 25;
    this.lockonLastUsed = -25;

    this.fakeActive = false;
    this.fakeStart = 0;
    this.fakeDuration = 10;
    this.fakeCd = 20;
    this.fakeLastUsed = -20;
    this.fakeAbsorbed = 0;
    this.fakeOrbsAngle = 0;
    this.fakeMode = "follow";

    this.helpActive = false;
    this.helpStart = 0;
    this.helpDuration = 12;
    this.helpCd = 30;
    this.helpLastUsed = -30;
    this.helpers = [];

    this.damageTakenThisLife = 0;
  }

  hasSkill(key) { return this.equipped.includes(key); }

  triggerDash() {
    const t = now();
    if (t - this.lastDashTime >= this.dashCd) {
      this.lastDashTime = t; this.dashEndTime = t + 0.18;
    }
  }

  fireStrongBullet(enemies) {
    const t = now();
    if (t - this.lastStrongBulletTime >= this.strongBulletCd) {
      this.lastStrongBulletTime = t;
      const sb = new StrongBullet(this.x, this.y, this.angle);
      const locked = this.getLockonTargets();
      const pool = locked.length ? locked : enemies;
      let best = null, bestD = Infinity;
      for (const e of pool) {
        if (!e.isAlive) continue;
        const d = Math.hypot(e.x - this.x, e.y - this.y);
        if (d < bestD) { bestD = d; best = e; }
      }
      if (best) {
        sb.angle = Math.atan2(best.y - this.y, best.x - this.x);
        sb.dx = Math.cos(sb.angle); sb.dy = Math.sin(sb.angle);
        if (locked.includes(best)) { sb.lockOnTarget = best; sb.damageMult = 1.5; }
      }
      return sb;
    }
    return null;
  }

  fireRockets(enemies) {
    const t = now();
    if (t - this.lastRocketTime >= this.rocketCd) {
      const alive = enemies.filter(e => e.isAlive);
      if (!alive.length) return [];
      this.lastRocketTime = t;
      const rockets = [];
      for (let i = 0; i < 5; i++) {
        const target = alive[i % alive.length];
        const spread = (i - 2) * 0.35;
        const off = this.angle + spread;
        rockets.push(new Rocket(this.x + Math.cos(off) * 14, this.y + Math.sin(off) * 14,
                                target, 5.5, "#ff9f43", false));
      }
      return rockets;
    }
    return [];
  }

  activateShield() {
    const t = now();
    if (!this.hasSkill("shield")) return;
    if (this.shieldHp > 0) return;
    if (t - this.shieldLastUsed < this.shieldCd) return;
    this.shieldHp = this.shieldMax;
  }
  tryArmStrike() {
    const t = now();
    if (!this.hasSkill("strike")) return;
    if (this.isStriking) return;
    if (t - this.strikeLastUsed < this.strikeCd) return;
    this.strikePending = true;
  }
  beginStrike(angle) {
    this.isStriking = true;
    this.strikePending = false;
    this.strikeDir = [Math.cos(angle), Math.sin(angle)];
    this.strikeLastUsed = now();
    this.strikeTrail = [];
  }
  activateLockon() {
    const t = now();
    if (!this.hasSkill("lockon")) return;
    if (t - this.lockonLastUsed < this.lockonCd) return;
    this.lockonSelecting = true;
    this.lockonActive = false;
  }
  commitLockon() {
    // Persist the placed circles for 2 seconds and lock enemies inside
    this.lockonLastUsed = now();
    this.lockonSelecting = false;
    this.lockonActive = true;
    const expire = now() + 2;
    for (const c of this.lockonPath) {
      this.lockonCircles.push({ x: c.x, y: c.y, r: c.r, expire });
      for (const e of game.enemies) {
        if (e.isAlive && Math.hypot(e.x - c.x, e.y - c.y) < c.r + e.radius) {
          this.lockonLocked.add(e);
        }
      }
    }
    this.lockonPath = [];
  }
  updateLockon() {
    // Remove expired circles from visuals
    const t = now();
    this.lockonCircles = this.lockonCircles.filter(c => c.expire > t);
    // Keep locked set clean (drop dead ones)
    for (const e of [...this.lockonLocked]) {
      if (!e.isAlive) this.lockonLocked.delete(e);
    }
  }
  getLockonTargets() {
    if (!this.lockonActive) return [];
    // Locked-forever targets, filtered to still-alive
    const alive = [];
    for (const e of this.lockonLocked) if (e.isAlive) alive.push(e);
    return alive;
  }
  activateFake() {
    const t = now();
    if (!this.hasSkill("fake")) return;
    if (this.fakeActive) return;
    if (t - this.fakeLastUsed < this.fakeCd) return;
    this.fakeActive = true;
    this.fakeStart = t;
    this.fakeAbsorbed = 0;
    this.fakeMode = Math.random() < 0.5 ? "follow" : "attack";
    this.damageTakenThisLife = 0;
  }
  activateHelp() {
    const t = now();
    if (!this.hasSkill("help")) return;
    if (this.helpActive) return;
    if (t - this.helpLastUsed < this.helpCd) return;
    this.helpActive = true;
    this.helpStart = t;
    this.helpers = [];
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      const hx = this.x + Math.cos(a) * 60;
      const hy = this.y + Math.sin(a) * 60;
      this.helpers.push(new Helper(hx, hy, [...this.equipped]));
    }
  }

  move(dx, dy, aimAngle) {
    if (!this.isAlive) return;
    if (this.isStriking) return;
    const speed = this.baseSpeed * (now() < this.dashEndTime ? 2.6 : 1.0);
    this.x = Math.max(this.radius, Math.min(W - this.radius, this.x + dx * speed));
    this.y = Math.max(this.radius, Math.min(H - this.radius, this.y + dy * speed));
    this.angle = aimAngle;
  }

  updateStrike() {
    if (!this.isStriking) return;
    const speed = 22 * SPEED_MULT;
    this.angle = Math.atan2(this.strikeDir[1], this.strikeDir[0]);
    this.x += this.strikeDir[0] * speed;
    this.y += this.strikeDir[1] * speed;
    if (this.x < this.radius || this.x > W - this.radius ||
        this.y < this.radius || this.y > H - this.radius) {
      this.x = Math.max(this.radius, Math.min(W - this.radius, this.x));
      this.y = Math.max(this.radius, Math.min(H - this.radius, this.y));
      this.isStriking = false;
      // Shadow disappears when crashing ends
      this.strikeTrail = [];
    }
    // Trail fades
    for (const tr of this.strikeTrail) tr.life -= 0.03;
    this.strikeTrail = this.strikeTrail.filter(t => t.life > 0);
  }

  updateFake() {
    if (!this.fakeActive) return;
    const t = now();
    this.fakeOrbsAngle += 0.1;
    if (t - this.fakeStart >= this.fakeDuration) {
      const diff = game.difficultyKey;
      const mult = (diff === "master" || diff === "hell") ? 0.5 : 1.0;
      const heal = Math.floor(this.fakeAbsorbed * 1.5 * mult);
      this.hp = Math.min(this.maxHp, this.hp + heal);
      this.fakeActive = false;
      this.fakeLastUsed = t;
      this.fakeAbsorbed = 0;
      this.takeMandatoryDamage(1);
    }
  }
  takeMandatoryDamage(n) {
    this.hp -= n;
    if (this.hp <= 0) { this.hp = 0; this.isAlive = false; }
  }
  takeDamage(n = 1) {
    if (this.isStriking) return;
    if (this.fakeActive) {
      this.fakeAbsorbed += n;
      return;
    }
    if (this.shieldHp > 0) {
      const absorbed = Math.min(this.shieldHp, n);
      this.shieldHp -= absorbed;
      n -= absorbed;
      if (this.shieldHp <= 0) {
        this.shieldHp = 0;
        this.shieldLastUsed = now();
      }
    }
    if (n <= 0) return;
    this.hp -= n;
    this.damageTakenThisLife += n;
    if (this.hp <= 0) { this.hp = 0; this.isAlive = false; }
  }
  onKill() {
    this.kills++;
    if (this.kills % 25 === 0) this.hp = Math.min(this.maxHp, this.hp + 10);
  }
}

// ===================== HELPER (grey, free-moving, random skills, 1/2 damage) =====================
class Helper {
  constructor(x, y, equipped) {
    this.x = x; this.y = y;
    this.radius = 12;
    this.baseSpeed = 5.0 * SPEED_MULT;
    this.angle = 0;
    this.equipped = equipped;
    this.lastShot = 0;
    this.lastRocket = 0;
    this.lastShield = -30;
    this.shieldHp = 0;
    // Roaming
    this.roamAngle = Math.random() * Math.PI * 2;
    this.roamTimer = 0;
    this.skillTimer = Math.random() * 2;
  }

  update(target, enemies, redBullets, redRockets) {
    if (!target.isAlive) return;
    const t = now();

    // Free movement: wander around red at medium distance
    this.roamTimer -= 0.016;
    if (this.roamTimer <= 0) {
      this.roamAngle = Math.random() * Math.PI * 2;
      this.roamTimer = 1 + Math.random() * 2;
    }
    const dx = target.x - this.x, dy = target.y - this.y;
    const d = Math.hypot(dx, dy) || 1;
    // Move toward an orbit point around red
    const orbitX = target.x + Math.cos(this.roamAngle) * 140;
    const orbitY = target.y + Math.sin(this.roamAngle) * 140;
    const ox = orbitX - this.x, oy = orbitY - this.y;
    const od = Math.hypot(ox, oy) || 1;
    if (od > 20) {
      this.x += (ox / od) * this.baseSpeed;
      this.y += (oy / od) * this.baseSpeed;
    }

    // Aim at nearest enemy
    let best = null, bestD = Infinity;
    for (const e of enemies) {
      if (!e.isAlive) continue;
      const ed = Math.hypot(e.x - this.x, e.y - this.y);
      if (ed < bestD) { bestD = ed; best = e; }
    }
    if (best) this.angle = Math.atan2(best.y - this.y, best.x - this.x);

    // Bullets — 1/2 red damage
    if (t - this.lastShot > 0.15) {
      this.lastShot = t;
      const b = new Bullet(this.x, this.y, this.angle, 11, 4, "#bbbbbb", false);
      b.fromHelper = true;
      b.damageMult = 0.5;
      redBullets.push(b);
    }

    // Random skills
    this.skillTimer -= 0.016;
    if (this.skillTimer <= 0) {
      this.skillTimer = 2 + Math.random() * 3;
      const chosen = ["rocket", "beam", "shield", "dash"];
      const pick = chosen[Math.floor(Math.random() * chosen.length)];

      if (pick === "rocket" && t - this.lastRocket > 4 && best) {
        this.lastRocket = t;
        const r = new Rocket(this.x, this.y, best, 5.0, "#ffbb77", true);
        r.damage = 0.5;
        redRockets.push(r);
      } else if (pick === "beam" && t - (this.lastBeam || 0) > 6 && best) {
        this.lastBeam = t;
        const sb = new StrongBullet(this.x, this.y, this.angle);
        sb.fromHelper = true;
        sb.speed = 17 * SPEED_MULT * 0.7;
        game.redStrongBullets.push(sb);
      } else if (pick === "shield" && this.shieldHp <= 0 && t - this.lastShield > 30) {
        this.shieldHp = 5; // helpers have a smaller shield
        this.lastShield = t;
      } else if (pick === "dash") {
        // Small boost toward target
        this.x += Math.cos(this.angle) * 30;
        this.y += Math.sin(this.angle) * 30;
      }
    }

    this.x = Math.max(this.radius, Math.min(W - this.radius, this.x));
    this.y = Math.max(this.radius, Math.min(H - this.radius, this.y));
  }
  draw() {
    if (this.shieldHp > 0) {
      ctx.strokeStyle = "#06d6a0"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.radius + 4, 0, Math.PI * 2);
      ctx.stroke();
    }
    drawTri(this.x, this.y, this.radius, this.angle, "#888888");
  }
}

// ===================== ENEMIES =====================
class YellowTriangle {
  constructor(x, y, hp = 4) {
    this.x = x; this.y = y;
    this.radius = 22;
    this.baseSpeed = 8.5 * SPEED_MULT;
    this.angle = 0;
    this.maxHp = hp; this.hp = hp; this.isAlive = true;
    this.preferredDistance = 240;
    this.transAmActive = false;
    this.transAmNext = now() + 1.5;
    this.transAmEnd = 0;
    this.transAmDuration = 30;
    this.transAmCooldown = 10;
    this.isCharging = false; this.isDashing = false;
    this.chargeStart = 0;
    this.dashDir = [0, 0];
    this.dashTravelled = 0; this.dashMaxDist = 0;
    this.dashHitDone = false;
    this.lastAttackTime = now() + Math.random() * 1.5;
    this.attackInterval = 1.8;
    this.trail = [];
    this.orbitAngle = Math.random() * Math.PI * 2;
    this.orbitDir = Math.random() < 0.5 ? 1 : -1;
    this.orbitSpeed = 0.02 + Math.random() * 0.02;
    this.canShoot = true;
  }
  takeDamage(n = 1) {
    this.hp -= n;
    if (this.hp <= 0) { this.hp = 0; this.isAlive = false; }
  }
  updateTransAmState() {
    const t = now();
    if (!this.transAmActive && t >= this.transAmNext) {
      this.transAmActive = true;
      this.transAmEnd = t + this.transAmDuration;
    } else if (this.transAmActive && t >= this.transAmEnd) {
      this.transAmActive = false;
      this.transAmNext = t + this.transAmCooldown;
    }
  }
  triggerDash(target) {
    if (!this.transAmActive) return;
    if (this.isCharging || this.isDashing) return;
    this.isCharging = true;
    this.chargeStart = now();
    const dx = target.x - this.x, dy = target.y - this.y;
    const d = Math.hypot(dx, dy) || 1;
    this.dashDir = [dx / d, dy / d];
    this.dashMaxDist = Math.max(W, H) * 1.5;
    this.dashTravelled = 0;
    this.dashHitDone = false;
  }
  updateDash(target) {
    const elapsed = now() - this.chargeStart;
    if (this.isCharging) {
      if (elapsed >= 0.5) { this.isCharging = false; this.isDashing = true; }
    } else if (this.isDashing) {
      const sp = this.baseSpeed * 5;
      this.x += this.dashDir[0] * sp;
      this.y += this.dashDir[1] * sp;
      this.dashTravelled += sp;
      if (!this.dashHitDone && target.isAlive &&
          Math.hypot(target.x - this.x, target.y - this.y) < this.radius + target.radius) {
        target.takeDamage(5);
        this.dashHitDone = true;
      }
      if (this.x < this.radius || this.x > W - this.radius ||
          this.y < this.radius || this.y > H - this.radius ||
          this.dashTravelled >= this.dashMaxDist) {
        this.isDashing = false;
        // Shadow disappears when crash ends
        this.trail = [];
        this.x = Math.max(this.radius, Math.min(W - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(H - this.radius, this.y));
      }
    }
  }
  update(target, enemyBullets) {
    if (!this.isAlive || !target.isAlive) return;
    this.updateTransAmState();
    const speedMult = this.transAmActive ? 1.5 : 1.0;
    const speed = this.baseSpeed * speedMult;
    const dx = target.x - this.x, dy = target.y - this.y;
    const dist = Math.hypot(dx, dy) || 1;
    this.angle = Math.atan2(dy, dx);

    if (this.transAmActive && !this.isCharging && !this.isDashing) {
      this.trail.push({ x: this.x, y: this.y, a: this.angle, life: 0.35 });
    }
    for (const tr of this.trail) tr.life -= 0.03;
    this.trail = this.trail.filter(t => t.life > 0);

    if (this.isCharging || this.isDashing) {
      this.updateDash(target);
    } else {
      this.orbitAngle += this.orbitSpeed * this.orbitDir;
      const targetX = target.x + Math.cos(this.orbitAngle) * this.preferredDistance;
      const targetY = target.y + Math.sin(this.orbitAngle) * this.preferredDistance;
      const toTX = targetX - this.x, toTY = targetY - this.y;
      const toTD = Math.hypot(toTX, toTY) || 1;
      if (toTD > 5) {
        this.x += (toTX / toTD) * speed;
        this.y += (toTY / toTD) * speed;
      }
      if (this.canShoot && now() - this.lastAttackTime >= this.attackInterval) {
        this.lastAttackTime = now();
        const choice = this.transAmActive
          ? ["single", "single_strong", "trans_am"][Math.floor(Math.random() * 3)]
          : ["single", "single_strong"][Math.floor(Math.random() * 2)];
        if (choice === "single") {
          enemyBullets.push(new Bullet(this.x, this.y, this.angle, 11, 6, "#ffe66d"));
        } else if (choice === "single_strong") {
          const b = new Bullet(this.x, this.y, this.angle, 16, 9, "#ffffff", true);
          b.damageMult = 2;
          enemyBullets.push(b);
        } else {
          this.triggerDash(target);
        }
      }
    }
    this.x = Math.max(this.radius, Math.min(W - this.radius, this.x));
    this.y = Math.max(this.radius, Math.min(H - this.radius, this.y));
  }
  draw() {
    for (const tr of this.trail) {
      ctx.globalAlpha = Math.max(0, tr.life / 0.35) * 0.5;
      drawTri(tr.x, tr.y, this.radius * 0.9, tr.a, "#ffffff");
    }
    ctx.globalAlpha = 1;

    let color = "#f9d56e";
    if (this.isCharging) color = (Math.floor(now() * 20) % 2 === 0) ? "#ffffff" : "#ffdddd";
    else if (this.isDashing) color = "#ff5500";
    else if (this.transAmActive) color = "#ffe066";

    drawTri(this.x, this.y, this.radius, this.angle, color);
    drawHpBar(this.x, this.y, this.hp, this.maxHp);

    if (this.isCharging) {
      ctx.strokeStyle = "#ff0000"; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      ctx.lineTo(this.x + this.dashDir[0] * 400,
                 this.y + this.dashDir[1] * 400);
      ctx.stroke(); ctx.setLineDash([]);
    }
  }
}

class BlueTriangle {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.radius = 17; this.speed = 4.8 * SPEED_MULT; this.angle = 0;
    this.maxHp = 2; this.hp = 2; this.isAlive = true;
    this.lastRocketTime = now(); this.rocketInterval = 2.0;
  }
  takeDamage(n = 1) {
    this.hp -= n;
    if (this.hp <= 0) { this.hp = 0; this.isAlive = false; }
  }
  update(target, enemyRockets) {
    if (!this.isAlive || !target.isAlive) return;
    const dx = target.x - this.x, dy = target.y - this.y;
    const dist = Math.hypot(dx, dy) || 1;
    this.angle = Math.atan2(dy, dx);
    if (dist > 120) {
      this.x += (dx / dist) * this.speed;
      this.y += (dy / dist) * this.speed;
    }
    if (now() - this.lastRocketTime >= this.rocketInterval) {
      this.lastRocketTime = now();
      for (let i = 0; i < 3; i++) {
        if (enemyRockets.length < 10) {
          enemyRockets.push(new Rocket(this.x, this.y, target, 5.0, "#ff9f43"));
        }
      }
    }
    this.x = Math.max(this.radius, Math.min(W - this.radius, this.x));
    this.y = Math.max(this.radius, Math.min(H - this.radius, this.y));
  }
  draw() {
    drawTri(this.x, this.y, this.radius, this.angle, "#00adb5");
    drawHpBar(this.x, this.y, this.hp, this.maxHp);
  }
}

class PurpleTriangle {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.radius = 23; this.speed = 3.6 * SPEED_MULT; this.angle = 0;
    this.maxHp = 6; this.hp = 6; this.isAlive = true;
    this.preferredDistance = 300;
    this.lastShotTime = now(); this.shotInterval = 0.9;
  }
  takeDamage(n = 1) {
    this.hp -= n;
    if (this.hp <= 0) { this.hp = 0; this.isAlive = false; }
  }
  update(target, enemyBullets) {
    if (!this.isAlive || !target.isAlive) return;
    const dx = target.x - this.x, dy = target.y - this.y;
    const dist = Math.hypot(dx, dy) || 1;
    this.angle = Math.atan2(dy, dx);
    if (dist < this.preferredDistance - 25) {
      this.x -= (dx / dist) * this.speed;
      this.y -= (dy / dist) * this.speed;
    } else if (dist > this.preferredDistance + 25) {
      this.x += (dx / dist) * this.speed;
      this.y += (dy / dist) * this.speed;
    } else {
      const px = dy / dist, py = -dx / dist;
      this.x += px * this.speed * 0.6;
      this.y += py * this.speed * 0.6;
    }
    if (now() - this.lastShotTime >= this.shotInterval) {
      this.lastShotTime = now();
      const b = new Bullet(this.x, this.y, this.angle, 9, 6, "#c77dff");
      b.damageMult = 0.5;
      enemyBullets.push(b);
    }
    this.x = Math.max(this.radius, Math.min(W - this.radius, this.x));
    this.y = Math.max(this.radius, Math.min(H - this.radius, this.y));
  }
  draw() {
    drawTri(this.x, this.y, this.radius, this.angle, "#9d4edd");
    drawHpBar(this.x, this.y, this.hp, this.maxHp);
  }
}

// ===================== GREEN (merged, normal movement + crash) =====================
class GreenTriangle {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.radius = 18; this.speed = 4.5 * SPEED_MULT; this.angle = 0;
    this.maxHp = 4; this.hp = 4; this.isAlive = true;
    this.preferredDistance = 380;
    this.state = "firing";
    this.fireCooldown = now() + 1.0;
    this.waitStart = 0;
    this.chargeStart = 0;
    this.dashDir = [0, 0];
    this.dashTravelled = 0;
    this.dashMaxDist = 0;
    this.dashHitDone = false;
  }
  takeDamage(n = 1) {
    this.hp -= n;
    if (this.hp <= 0) { this.hp = 0; this.isAlive = false; }
  }
  update(target, enemyRockets) {
    if (!this.isAlive || !target.isAlive) return;
    const t = now();
    const dx = target.x - this.x, dy = target.y - this.y;
    const dist = Math.hypot(dx, dy) || 1;
    this.angle = Math.atan2(dy, dx);

    if (this.state !== "dashing") {
      // Normal movement at preferred distance
      if (dist > this.preferredDistance - 40) {
        this.x += (dx / dist) * this.speed;
        this.y += (dy / dist) * this.speed;
      } else if (dist < this.preferredDistance - 100) {
        this.x -= (dx / dist) * this.speed;
        this.y -= (dy / dist) * this.speed;
      }
    }

    if (this.state === "firing") {
      if (t >= this.fireCooldown) {
        for (let i = 0; i < 7; i++) {
          if (enemyRockets.length < 30) {
            enemyRockets.push(new Rocket(this.x, this.y, target, 6.5, "#ff9f43"));
          }
        }
        this.state = "waiting";
        this.waitStart = t;
      }
    } else if (this.state === "waiting") {
      const rocketCount = enemyRockets.filter(r => r.target === target).length;
      if (rocketCount === 0 || t - this.waitStart >= 4) {
        this.state = "charging";
        this.chargeStart = t;
        this.dashDir = [dx / dist, dy / dist];
        this.dashMaxDist = dist + 150;
        this.dashTravelled = 0;
        this.dashHitDone = false;
      }
    } else if (this.state === "charging") {
      if (t - this.chargeStart >= 2.0) {
        this.state = "dashing";
      }
    } else if (this.state === "dashing") {
      const sp = this.speed * 5;
      this.x += this.dashDir[0] * sp;
      this.y += this.dashDir[1] * sp;
      this.dashTravelled += sp;
      if (!this.dashHitDone && target.isAlive &&
          Math.hypot(target.x - this.x, target.y - this.y) < this.radius + target.radius + this.radius * 0.5) {
        target.takeDamage(3);
        this.dashHitDone = true;
      }
      if (this.dashTravelled >= this.dashMaxDist ||
          this.x < this.radius || this.x > W - this.radius ||
          this.y < this.radius || this.y > H - this.radius) {
        this.state = "firing";
        this.fireCooldown = now() + 2.0;
      }
    }
    this.x = Math.max(this.radius, Math.min(W - this.radius, this.x));
    this.y = Math.max(this.radius, Math.min(H - this.radius, this.y));
  }
  draw() {
    let color = "#06d6a0";
    if (this.state === "charging") color = (Math.floor(now() * 10) % 2 === 0) ? "#ffffff" : "#88ffcc";
    else if (this.state === "dashing") color = "#00ff88";
    drawTri(this.x, this.y, this.radius, this.angle, color);
    drawHpBar(this.x, this.y, this.hp, this.maxHp);

    if (this.state === "charging") {
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      ctx.lineTo(this.x + this.dashDir[0] * this.dashMaxDist,
                 this.y + this.dashDir[1] * this.dashMaxDist);
      ctx.stroke(); ctx.setLineDash([]);
    }
  }
}

const SKILLS = {
  shield:   { name: "SHIELD",   cost: 300 },

  fake:     { name: "FAKE",     cost: 400 },
  help:     { name: "HELP",     cost: 600 },
};

const MAX_EQUIPPED = 3;

// ===================== GAME =====================
class Game {
  constructor() {
    this.touchMode = false;
    this.state = "control";
    this.difficultyKey = null;
    this.difficulty = null;
    this.buttons = [];

    this.marks = 0;
    this.ownedSkills = { shield: false, strike: false, lockon: false, fake: false, help: false };
    this.equippedSkills = [];

    this.player = null;
    this.enemies = [];
    this.redBullets = [];
    this.redStrongBullets = [];
    this.redRockets = [];
    this.enemyBullets = [];
    this.enemyRockets = [];

    this.isShooting = false;
    this.lastAutoShootTime = 0;
    this.autoShootInterval = 0.1;

    this.mousePos = [W / 2, H / 2];
    this.keys = {};

    this.lJoy = { cx: 0, cy: 0, r: 0, kx: 0, ky: 0, active: false };
    this.rJoy = { cx: 0, cy: 0, r: 0, kx: 0, ky: 0, active: false };
    this.leftMoveDir = [0, 0];
    this.rightAimAngle = 0;
    this.rightFiring = false;

    this.skillR = 32;
    this.rocketBtn = { cx: 0, cy: 0 };
    this.powerBtn  = { cx: 0, cy: 0 };
    this.skillBtns = {};

    this.powerShotPending = false;
    this.touches = new Map();
    this.returnToModeOnAnyInput = false;
  }

  setupJoysticks() {
    const r = Math.min(W, H) * 0.13;
    this.lJoy.r = r; this.rJoy.r = r;
    this.lJoy.cx = r + 20;     this.lJoy.cy = H - r - 20;
    this.rJoy.cx = W - r - 20; this.rJoy.cy = H - r - 20;
    this.lJoy.kx = this.lJoy.cx; this.lJoy.ky = this.lJoy.cy;
    this.rJoy.kx = this.rJoy.cx; this.rJoy.ky = this.rJoy.cy;
    this.skillR = 32;
    const y0 = 50;
    this.rocketBtn.cx = W - 40; this.rocketBtn.cy = y0;
    this.powerBtn.cx  = W - 110; this.powerBtn.cy = y0;
    this.skillBtns = {};
    this.equippedSkills.forEach((s, i) => {
      this.skillBtns[s] = { cx: W - 180 - i * 70, cy: y0 };
    });
  }

  startGame(touchMode, difficultyKey) {
    this.touchMode = touchMode;
    this.difficultyKey = difficultyKey;
    this.difficulty = DIFFICULTIES[difficultyKey];
    this.state = "playing";
    this.returnToModeOnAnyInput = false;
    if (touchMode) this.setupJoysticks();
    this.resetPlay();
  }

  resetPlay() {
    const d = this.difficulty;
    this.player = new PlayerRed(200, H / 2, d.playerHp);
    this.player.score = this.marks;
    this.player.equipped = [...this.equippedSkills];

    this.redBullets = [];
    this.redStrongBullets = [];
    this.redRockets = [];
    this.enemyBullets = [];
    this.enemyRockets = [];
    this.isShooting = false;

    this.enemies = [];
    const totalStart = d.startEnemies.yellow + d.startEnemies.blue +
                       d.startEnemies.purple + d.startEnemies.green;
    const spawnPoints = this.makeSpawnLayout(totalStart);
    let i = 0;
    for (let n = 0; n < d.startEnemies.yellow; n++) this.enemies.push(new YellowTriangle(...spawnPoints[i++], 4));
    for (let n = 0; n < d.startEnemies.blue; n++)   this.enemies.push(new BlueTriangle(...spawnPoints[i++]));
    for (let n = 0; n < d.startEnemies.purple; n++) this.enemies.push(new PurpleTriangle(...spawnPoints[i++]));
    for (let n = 0; n < d.startEnemies.green; n++)  this.enemies.push(new GreenTriangle(...spawnPoints[i++]));
  }

  makeSpawnLayout(count) {
    const pts = [];
    if (!count) return pts;
    const rightEdge = Math.max(W * 0.6, W - 250);
    for (let i = 0; i < count; i++) {
      const col = i % 3;
      const row = Math.floor(i / 3);
      const x = rightEdge + col * 30 + Math.random() * 20;
      const y = 100 + row * 80 + Math.random() * 40;
      pts.push([Math.min(x, W - 40), Math.min(y, H - 60)]);
    }
    return pts;
  }

  chooseEnemyTypeToSpawn() {
    const d = this.difficulty;
    const alive = this.enemies.filter(e => e.isAlive);
    const counts = {
      yellow: alive.filter(e => e instanceof YellowTriangle).length,
      blue:   alive.filter(e => e instanceof BlueTriangle).length,
      purple: alive.filter(e => e instanceof PurpleTriangle).length,
      green:  alive.filter(e => e instanceof GreenTriangle).length,
    };
    const nonYellowTotal = counts.blue + counts.purple + counts.green;
    const yellowsUnlocked =
      d.scoreForYellow !== null &&
      this.player.score >= d.scoreForYellow &&
      d.maxEnemies.yellow > 0 &&
      counts.yellow < d.maxYellowsOnScreen;
    const pool = [];
    if (nonYellowTotal < 5) {
      if (counts.blue   < d.maxEnemies.blue)   pool.push("blue");
      if (counts.purple < d.maxEnemies.purple) pool.push("purple");
      if (counts.green  < d.maxEnemies.green)  pool.push("green");
    }
    if (yellowsUnlocked) pool.push("yellow");
    if (!pool.length) return null;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  spawnRandomEnemy() {
    const type = this.chooseEnemyTypeToSpawn();
    if (!type) return null;
    let x, y, attempts = 0;
    do {
      const side = Math.floor(Math.random() * 4);
      if (side === 0)      { x = 50 + Math.random() * (W - 100); y = 30; }
      else if (side === 1) { x = 50 + Math.random() * (W - 100); y = H - 30; }
      else if (side === 2) { x = 30; y = 50 + Math.random() * (H - 100); }
      else                 { x = W - 30; y = 50 + Math.random() * (H - 100); }
      attempts++;
    } while (attempts < 30 && this.enemies.some(e =>
      e.isAlive && Math.hypot(e.x - x, e.y - y) < (e.radius + 30)
    ));
    if (type === "yellow") return new YellowTriangle(x, y, 4);
    if (type === "blue")   return new BlueTriangle(x, y);
    if (type === "purple") return new PurpleTriangle(x, y);
    if (type === "green")  return new GreenTriangle(x, y);
    return null;
  }

  // ---------- INPUT ----------
  onPointerDown(id, x, y) {
    if (this.returnToModeOnAnyInput) {
      this.returnToModeOnAnyInput = false;
      this.marks = this.player.score;
      this.state = "difficulty";
      return;
    }
    if (this.state === "control" || this.state === "difficulty" || this.state === "shop") {
      for (const b of this.buttons) {
        if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.action(); return; }
      }
      return;
    }

    if (this.player && this.player.lockonSelecting) {
      this.player.lockonPath.push({ x, y, r: 80 });
      setTimeout(() => {
        if (this.player && this.player.lockonSelecting) this.player.commitLockon();
      }, 400);
      return;
    }

    if (!this.touchMode) {
      if (id === "mouse" && this.player.isAlive) this.isShooting = true;
      return;
    }

    for (const [skillKey, btn] of Object.entries(this.skillBtns)) {
      if (Math.hypot(x - btn.cx, y - btn.cy) < this.skillR) {
        this.touches.set(id, skillKey);
        if (skillKey === "shield") this.player.activateShield();
        else if (skillKey === "strike") this.player.tryArmStrike();
        else if (skillKey === "lockon") this.player.activateLockon();
        else if (skillKey === "fake") this.player.activateFake();
        else if (skillKey === "help") this.player.activateHelp();
        return;
      }
    }
    if (Math.hypot(x - this.rocketBtn.cx, y - this.rocketBtn.cy) < this.skillR) {
      this.touches.set(id, "rocket");
      if (this.player.isAlive) this.redRockets.push(...this.player.fireRockets(this.enemies));
      return;
    }
    if (Math.hypot(x - this.powerBtn.cx, y - this.powerBtn.cy) < this.skillR) {
      this.touches.set(id, "power");
      if (this.player.isAlive) {
        if (this.rightFiring) this.powerShotPending = true;
        else {
          const sb = this.player.fireStrongBullet(this.enemies);
          if (sb) this.redStrongBullets.push(sb);
        }
      }
      return;
    }

    if (Math.hypot(x - this.lJoy.cx, y - this.lJoy.cy) < this.lJoy.r * 1.6) {
      this.touches.set(id, "ljoy");
      this.lJoy.active = true; this.updateLJoy(x, y); return;
    }
    if (Math.hypot(x - this.rJoy.cx, y - this.rJoy.cy) < this.rJoy.r * 1.6) {
      this.touches.set(id, "rjoy");
      this.rJoy.active = true; this.rightFiring = true; this.updateRJoy(x, y); return;
    }
    if (x > W / 2) {
      this.touches.set(id, "rjoy");
      this.rJoy.active = true; this.rightFiring = true; this.updateRJoy(x, y);
    } else {
      this.touches.set(id, "ljoy");
      this.lJoy.active = true; this.updateLJoy(x, y);
    }
  }

  onPointerMove(id, x, y) {
    if (this.state !== "playing") return;
    if (!this.touchMode) { if (id === "mouse") this.mousePos = [x, y]; return; }
    const t = this.touches.get(id);
    if (t === "ljoy") this.updateLJoy(x, y);
    else if (t === "rjoy") this.updateRJoy(x, y);
  }

  onPointerUp(id) {
    if (this.state !== "playing") return;
    if (!this.touchMode) {
      if (id === "mouse") this.isShooting = false;
      return;
    }
    const t = this.touches.get(id);
    if (t === "ljoy") {
      this.lJoy.active = false; this.leftMoveDir = [0, 0];
      this.lJoy.kx = this.lJoy.cx; this.lJoy.ky = this.lJoy.cy;
    } else if (t === "rjoy") {
      this.rJoy.active = false; this.rightFiring = false;
      this.rJoy.kx = this.rJoy.cx; this.rJoy.ky = this.rJoy.cy;
      if (this.player.strikePending) this.player.beginStrike(this.rightAimAngle);
      if (this.powerShotPending && this.player.isAlive) {
        this.powerShotPending = false;
        const sb = this.player.fireStrongBullet(this.enemies);
        if (sb) this.redStrongBullets.push(sb);
      }
    }
    this.touches.delete(id);
  }

  updateLJoy(x, y) {
    let dx = x - this.lJoy.cx, dy = y - this.lJoy.cy;
    const d = Math.hypot(dx, dy);
    if (d > this.lJoy.r) { dx = dx / d * this.lJoy.r; dy = dy / d * this.lJoy.r; }
    this.lJoy.kx = this.lJoy.cx + dx; this.lJoy.ky = this.lJoy.cy + dy;
    const nd = Math.hypot(dx, dy);
    this.leftMoveDir = nd > 5 ? [dx / nd, dy / nd] : [0, 0];
  }

  updateRJoy(x, y) {
    let dx = x - this.rJoy.cx, dy = y - this.rJoy.cy;
    const d = Math.hypot(dx, dy);
    if (d > this.rJoy.r) { dx = dx / d * this.rJoy.r; dy = dy / d * this.rJoy.r; }
    this.rJoy.kx = this.rJoy.cx + dx; this.rJoy.ky = this.rJoy.cy + dy;
    if (d > 5) this.rightAimAngle = Math.atan2(dy, dx);
  }

  onKey(k, isDown) {
    k = k.toLowerCase();
    this.keys[k] = isDown;
    if (isDown && this.returnToModeOnAnyInput) {
      this.returnToModeOnAnyInput = false;
      this.marks = this.player.score;
      this.state = "difficulty";
      return;
    }
    if (!isDown || this.state !== "playing" || !this.player || !this.player.isAlive) return;
    if (this.touchMode) return;
    if (k === "c") {
      const sb = this.player.fireStrongBullet(this.enemies);
      if (sb) this.redStrongBullets.push(sb);
    } else if (k === "e") {
      this.redRockets.push(...this.player.fireRockets(this.enemies));
    } else if (k === "q") this.player.activateShield();
    else if (k === "f") {
      this.player.tryArmStrike();
      if (this.player.strikePending) this.player.beginStrike(this.player.angle);
    } else if (k === "r") {
      this.player.activateLockon();
      if (this.player.lockonSelecting) {
        this.player.lockonPath.push({ x: this.mousePos[0], y: this.mousePos[1], r: 80 });
        this.player.commitLockon();
      }
    } else if (k === "g") this.player.activateFake();
    else if (k === "h") this.player.activateHelp();
    else if (k === " ") this.player.triggerDash();
  }

  // ---------- UPDATE ----------
  update() {
    if (this.state !== "playing" || !this.player) return;

    const aimAngle = this.touchMode ? this.rightAimAngle :
      Math.atan2(this.mousePos[1] - this.player.y, this.mousePos[0] - this.player.x);

    const t = now();
    this.player.updateLockon();

    if (!this.player.isStriking) {
      const firing = (!this.touchMode && this.isShooting) || (this.touchMode && this.rightFiring);
      if (firing && this.player.isAlive && t - this.lastAutoShootTime >= this.autoShootInterval) {
        this.lastAutoShootTime = t;
        const bullet = new Bullet(this.player.x, this.player.y, aimAngle, 12, 5, "#00fff5");
        const locked = this.player.getLockonTargets();
        if (locked.length) {
          let best = null, bestD = Infinity;
          for (const e of locked) {
            const d = Math.hypot(e.x - this.player.x, e.y - this.player.y);
            if (d < bestD) { bestD = d; best = e; }
          }
          if (best) { bullet.lockOnTarget = best; bullet.damageMult = 1.5; }
        }
        this.redBullets.push(bullet);
      }
    }

    let dx = 0, dy = 0;
    if (this.touchMode) [dx, dy] = this.leftMoveDir;
    else {
      if (this.keys["w"] || this.keys["arrowup"])    dy -= 1;
      if (this.keys["s"] || this.keys["arrowdown"])  dy += 1;
      if (this.keys["a"] || this.keys["arrowleft"])  dx -= 1;
      if (this.keys["d"] || this.keys["arrowright"]) dx += 1;
    }
    if (dx || dy) {
      const n = Math.hypot(dx, dy);
      this.player.move(dx / n, dy / n, aimAngle);
    } else {
      this.player.move(0, 0, aimAngle);
    }
    this.player.updateStrike();
    this.player.updateFake();

    if (this.player.helpActive) {
      if (t - this.player.helpStart >= this.player.helpDuration) {
        this.player.helpActive = false;
        this.player.helpLastUsed = t;
        this.player.helpers = [];
      } else {
        for (const h of this.player.helpers) {
          h.update(this.player, this.enemies, this.redBullets, this.redRockets);
        }
      }
    }

    if (this.player.isStriking) {
      const strikeRadius = this.player.radius * 1.5;
      for (const e of this.enemies) {
        if (e.isAlive && Math.hypot(this.player.x - e.x, this.player.y - e.y) < e.radius + strikeRadius) {
          e.takeDamage(99);
        }
      }
    }

    const yellows = this.enemies.filter(e => e instanceof YellowTriangle && e.isAlive);
    const yellowsToShoot = yellows.slice(0, 5);
    for (const y of yellows) y.canShoot = yellowsToShoot.includes(y);

    const newEnemies = [];
    for (const e of this.enemies) {
      if (e instanceof YellowTriangle)    e.update(this.player, this.enemyBullets);
      else if (e instanceof BlueTriangle) e.update(this.player, this.enemyRockets);
      else if (e instanceof GreenTriangle) e.update(this.player, this.enemyRockets);
      else                                e.update(this.player, this.enemyBullets);
      if (e.isAlive) newEnemies.push(e);
      else {
        this.player.score += 100;
        this.player.onKill();
        const resp = this.spawnRandomEnemy();
        if (resp) newEnemies.push(resp);
      }
    }
    this.enemies = newEnemies;

    for (const b of this.redBullets)       b.update();
    for (const b of this.redStrongBullets) b.update();
    for (const r of this.redRockets)       r.update();
    for (const b of this.enemyBullets)     b.update();
    for (const r of this.enemyRockets)     r.update();

    for (const b of this.redBullets) {
      if (!b.active) continue;
      for (const e of this.enemies) {
        if (e.isAlive && Math.hypot(b.x - e.x, b.y - e.y) < e.radius + b.radius) {
          const dmg = (b.lockOnTarget === e ? b.damageMult : 1) * (b.fromHelper ? 0.5 : 1);
          e.takeDamage(dmg);
          if (!b.piercing) b.active = false;
          break;
        }
      }
    }
    for (const sb of this.redStrongBullets) {
      if (!sb.active) continue;
      for (const e of this.enemies) {
        if (e.isAlive && Math.hypot(sb.x - e.x, sb.y - e.y) < e.radius + sb.radius) {
          const dmg = sb.lockOnTarget === e ? 99 * sb.damageMult : 99;
          e.takeDamage(sb.fromHelper ? dmg * 0.5 : dmg);
        }
      }
    }
    for (const r of this.redRockets) {
      if (!r.active) continue;
      for (const e of this.enemies) {
        if (e.isAlive && Math.hypot(r.x - e.x, r.y - e.y) < e.radius + r.radius) {
          r.active = false; e.takeDamage(r.damage * 2); break;
        }
      }
    }

    if (this.player.isAlive) {
      for (const b of this.enemyBullets) {
        if (b.active && Math.hypot(b.x - this.player.x, b.y - this.player.y) < this.player.radius + b.radius) {
          if (!b.piercing) b.active = false;
          else { b.x += b.dx * this.player.radius * 2.5; b.y += b.dy * this.player.radius * 2.5; }
          this.player.takeDamage(b.damageMult || 1);
        }
      }
      for (const r of this.enemyRockets) {
        if (r.active && Math.hypot(r.x - this.player.x, r.y - this.player.y) < this.player.radius + r.radius) {
          r.active = false; this.player.takeDamage(1);
        }
      }
    }

    this.redBullets       = this.redBullets.filter(b => b.active);
    this.redStrongBullets = this.redStrongBullets.filter(b => b.active);
    this.redRockets       = this.redRockets.filter(r => r.active);
    this.enemyBullets     = this.enemyBullets.filter(b => b.active);
    this.enemyRockets     = this.enemyRockets.filter(r => r.active);

    if (!this.player.isAlive && !this.returnToModeOnAnyInput) {
      this.marks = this.player.score;
      this.returnToModeOnAnyInput = true;
    }
  }

  // ---------- DRAW ----------
  draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#0b0c10"; ctx.fillRect(0, 0, W, H);

    if (this.state === "control")    return this.drawControlSelect();
    if (this.state === "difficulty") return this.drawDifficultySelect();
    if (this.state === "shop")       return this.drawShop();

    if (this.player.lockonSelecting) {
      ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.fillRect(0, 0, W, H);
      if (this.touchMode) {
        ctx.fillStyle = "#00fff5"; ctx.font = "18px Helvetica"; ctx.textAlign = "center";
        ctx.fillText("Tap to place lockon circle", W / 2, 60);
        ctx.textAlign = "left";
      } else {
        ctx.fillStyle = "#00fff5"; ctx.font = "18px Helvetica"; ctx.textAlign = "center";
        ctx.fillText("Move mouse & click to place lockon circle", W / 2, 60);
        ctx.textAlign = "left";
        ctx.strokeStyle = "#00fff5"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(this.mousePos[0], this.mousePos[1], 80, 0, Math.PI * 2); ctx.stroke();
      }
      for (const c of this.player.lockonPath) {
        ctx.strokeStyle = "#00fff5"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.stroke();
      }
    }

    // Active lockon circles — fade out over 2 s
    const t = now();
    for (const c of this.player.lockonCircles) {
      const remain = c.expire - t;
      if (remain > 0) {
        ctx.strokeStyle = `rgba(0,255,245,${Math.min(1, remain / 2)})`;
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
    // Highlight every locked-forever enemy
    for (const e of this.player.lockonLocked) {
      if (e.isAlive) {
        ctx.strokeStyle = "#00fff5"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.radius + 8, 0, Math.PI * 2); ctx.stroke();
      }
    }

    // Strike trails — only while actively striking
    if (this.player.isStriking) {
      for (const tr of this.player.strikeTrail) {
        ctx.globalAlpha = Math.max(0, tr.life / 0.25) * 0.7;
        drawTri(tr.x, tr.y, this.player.radius, tr.a, "#ffffff");
      }
      ctx.globalAlpha = 1;
    }

    for (const h of this.player.helpers) h.draw();

    if (this.player.isAlive) {
      let color = "#ff2e63";
      if (this.player.isStriking) color = "#ffffff";
      else if (now() < this.player.dashEndTime) color = "#ff8fa3";
      else if (this.player.shieldHp > 0) color = "#06d6a0";

      if (this.player.fakeActive) {
        const r = this.player.radius + 20;
        for (let i = 0; i < 2; i++) {
          const a = this.player.fakeOrbsAngle + i * Math.PI;
          const ox = this.player.x + Math.cos(a) * r;
          const oy = this.player.y + Math.sin(a) * r;
          ctx.strokeStyle = "#c77dff"; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(ox, oy, 10, 0, Math.PI * 2); ctx.stroke();
        }
      }

      if (this.player.shieldHp > 0) {
        ctx.strokeStyle = "#06d6a0"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(this.player.x, this.player.y, this.player.radius + 6, 0, Math.PI * 2);
        ctx.stroke();
      }

      drawTri(this.player.x, this.player.y, this.player.radius, this.player.angle, color);
      drawHpBar(this.player.x, this.player.y, this.player.hp, this.player.maxHp, "#06d6a0");

      if (this.player.strikePending) {
        const ex = this.player.x + Math.cos(this.rightAimAngle) * 300;
        const ey = this.player.y + Math.sin(this.rightAimAngle) * 300;
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
        ctx.beginPath(); ctx.moveTo(this.player.x, this.player.y); ctx.lineTo(ex, ey); ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    for (const e of this.enemies) if (e.isAlive) e.draw();
    for (const b of this.redBullets)       b.draw();
    for (const b of this.redStrongBullets) b.draw();
    for (const r of this.redRockets)       r.draw();
    for (const b of this.enemyBullets)     b.draw();
    for (const r of this.enemyRockets)     r.draw();

    if (this.touchMode) {
      this.drawJoystick(this.lJoy, "#00fff5", "#334455");
      this.drawJoystick(this.rJoy, "#ff2e63", "#553344");
      if (this.rJoy.active) {
        const ex = this.rJoy.cx + Math.cos(this.rightAimAngle) * (this.rJoy.r + 20);
        const ey = this.rJoy.cy + Math.sin(this.rightAimAngle) * (this.rJoy.r + 20);
        ctx.setLineDash([5, 5]); ctx.strokeStyle = "#ff2e63"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(this.rJoy.cx, this.rJoy.cy); ctx.lineTo(ex, ey); ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    const rkLeft = this.player.rocketCd - (t - this.player.lastRocketTime);
    const sbLeft = this.player.strongBulletCd - (t - this.player.lastStrongBulletTime);
    this.drawSkillButton(this.rocketBtn, "rocket", "E",
      Math.max(0, rkLeft / this.player.rocketCd), this.touchesValueHas("rocket"));
    this.drawSkillButton(this.powerBtn, "power", "C",
      Math.max(0, sbLeft / this.player.strongBulletCd), this.touchesValueHas("power"));

    for (const [key, btn] of Object.entries(this.skillBtns)) {
      let cdFrac = 0, glow = false;
      if (key === "shield") {
        cdFrac = this.player.shieldHp > 0 ? 0 :
          Math.max(0, (this.player.shieldCd - (t - this.player.shieldLastUsed)) / this.player.shieldCd);
        glow = this.player.shieldHp > 0;
      } else if (key === "strike") {
        cdFrac = Math.max(0, (this.player.strikeCd - (t - this.player.strikeLastUsed)) / this.player.strikeCd);
        glow = this.player.strikePending || this.player.isStriking;
      } else if (key === "lockon") {
        cdFrac = Math.max(0, (this.player.lockonCd - (t - this.player.lockonLastUsed)) / this.player.lockonCd);
        glow = this.player.lockonActive || this.player.lockonSelecting;
      } else if (key === "fake") {
        cdFrac = this.player.fakeActive ? 0 :
          Math.max(0, (this.player.fakeCd - (t - this.player.fakeLastUsed)) / this.player.fakeCd);
        glow = this.player.fakeActive;
      } else if (key === "help") {
        cdFrac = this.player.helpActive ? 0 :
          Math.max(0, (this.player.helpCd - (t - this.player.helpLastUsed)) / this.player.helpCd);
        glow = this.player.helpActive;
      }
      this.drawSkillButton(btn, key, this.skillLabel(key), cdFrac, this.touchesValueHas(key), glow);
    }

    this.drawHud();

    if (!this.player.isAlive) {
      ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#ff2e63"; ctx.font = "bold 28px Helvetica";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("GAME OVER", W / 2, H / 2 - 40);
      ctx.font = "16px Helvetica"; ctx.fillStyle = "#ddd";
      ctx.fillText(`Mode: ${this.difficulty.name}  |  Marks: ${this.player.score}  |  Kills: ${this.player.kills}`,
                   W / 2, H / 2);
      ctx.fillStyle = "#00fff5";
      ctx.fillText("Press any key / tap to return to mode select", W / 2, H / 2 + 40);
      ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    }
  }

  skillLabel(key) {
    return { shield: "Q", strike: "F", lockon: "R", fake: "G", help: "H" }[key] || key[0].toUpperCase();
  }

  touchesValueHas(val) {
    for (const v of this.touches.values()) if (v === val) return true;
    return false;
  }

  drawJoystick(j, activeColor, inactiveColor) {
    ctx.strokeStyle = j.active ? activeColor : inactiveColor;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(j.cx, j.cy, j.r, 0, Math.PI * 2); ctx.stroke();
    if (j.active) {
      ctx.beginPath(); ctx.moveTo(j.cx, j.cy); ctx.lineTo(j.kx, j.ky);
      ctx.strokeStyle = activeColor; ctx.stroke();
    }
    const kr = j.r * 0.35;
    ctx.beginPath(); ctx.arc(j.kx, j.ky, kr, 0, Math.PI * 2);
    ctx.fillStyle = j.active ? activeColor : inactiveColor; ctx.fill();
  }

  drawSkillButton(btn, symbol, label, cdFrac, pressed, activeGlow = false) {
    const r = this.skillR;
    ctx.beginPath(); ctx.arc(btn.cx, btn.cy, r, 0, Math.PI * 2);
    ctx.fillStyle = pressed ? "#2a2a4e" : "#1a1a2e"; ctx.fill();
    ctx.strokeStyle = activeGlow ? "#00ff88" : "#555";
    ctx.lineWidth = activeGlow ? 3 : 2;
    ctx.stroke();

    if (cdFrac > 0) {
      ctx.beginPath(); ctx.moveTo(btn.cx, btn.cy);
      ctx.arc(btn.cx, btn.cy, r, -Math.PI / 2, -Math.PI / 2 + cdFrac * Math.PI * 2);
      ctx.closePath(); ctx.fillStyle = "rgba(11,12,16,0.85)"; ctx.fill();
    }
    ctx.save(); ctx.globalAlpha = 0.55; ctx.fillStyle = "#dddddd";
    const s = r * 0.5;
    if (symbol === "rocket") {
      ctx.beginPath();
      ctx.moveTo(btn.cx, btn.cy - s);
      ctx.lineTo(btn.cx + s * 0.5, btn.cy);
      ctx.lineTo(btn.cx + s * 0.3, btn.cy + s * 0.6);
      ctx.lineTo(btn.cx - s * 0.3, btn.cy + s * 0.6);
      ctx.lineTo(btn.cx - s * 0.5, btn.cy);
      ctx.closePath(); ctx.fill();
    } else if (symbol === "power") {
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4;
        const rr = r * (i % 2 === 0 ? 0.5 : 0.25);
        const px = btn.cx + Math.cos(a) * rr;
        const py = btn.cy + Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill();
    } else if (symbol === "shield") {
      ctx.beginPath();
      ctx.moveTo(btn.cx, btn.cy - s);
      ctx.lineTo(btn.cx + s * 0.7, btn.cy - s * 0.4);
      ctx.lineTo(btn.cx + s * 0.6, btn.cy + s * 0.4);
      ctx.lineTo(btn.cx, btn.cy + s);
      ctx.lineTo(btn.cx - s * 0.6, btn.cy + s * 0.4);
      ctx.lineTo(btn.cx - s * 0.7, btn.cy - s * 0.4);
      ctx.closePath(); ctx.fill();
    } else if (symbol === "strike") {
      ctx.beginPath();
      ctx.moveTo(btn.cx, btn.cy - s);
      ctx.lineTo(btn.cx + s * 0.4, btn.cy);
      ctx.lineTo(btn.cx, btn.cy + s);
      ctx.lineTo(btn.cx - s * 0.4, btn.cy);
      ctx.closePath(); ctx.fill();
    } else if (symbol === "lockon") {
      ctx.beginPath(); ctx.arc(btn.cx, btn.cy, s * 0.7, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(btn.cx, btn.cy, s * 0.3, 0, Math.PI * 2); ctx.fill();
    } else if (symbol === "fake") {
      ctx.beginPath(); ctx.arc(btn.cx, btn.cy, s * 0.8, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(btn.cx, btn.cy, s * 0.5, 0, Math.PI * 2); ctx.stroke();
    } else if (symbol === "help") {
      for (let i = 0; i < 3; i++) {
        const a = i * Math.PI * 2 / 3;
        const px = btn.cx + Math.cos(a) * s * 0.6;
        const py = btn.cy + Math.sin(a) * s * 0.6;
        ctx.beginPath(); ctx.arc(px, py, s * 0.25, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
    ctx.fillStyle = "#aaa"; ctx.font = "10px Helvetica";
    ctx.textAlign = "center";
    ctx.fillText(label, btn.cx, btn.cy + r + 14);
    ctx.textAlign = "left";
  }

  drawHud() {
    const t = now();
    const dsLeft = this.player.dashCd - (t - this.player.lastDashTime);
    const lines = [];
    lines.push(`[${this.difficulty.name}]  HP: ${this.player.hp}/${this.player.maxHp}  |  Marks: ${this.player.score}  |  Kills: ${this.player.kills}`);
    if (this.touchMode) {
      lines.push("TOUCH — L: move | R: aim+fire | Tap icons for skills");
    } else {
      lines.push("[LMB]Fire [E]Rocket [C]Beam [Q]Shield [F]Strike [R]Lockon [G]Fake [H]Help");
      lines.push(`[Space]Dash: ${dsLeft <= 0 ? "READY" : dsLeft.toFixed(1) + "s"}`);
    }
    ctx.fillStyle = "#e0e0e0"; ctx.font = "13px Helvetica";
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    lines.forEach((line, i) => ctx.fillText(line, 12, 12 + i * 20));
  }

  drawControlSelect() {
    this.buttons = [];
    ctx.textAlign = "center";
    ctx.fillStyle = "#ff2e63"; ctx.font = "bold 34px Helvetica";
    ctx.fillText("TRIANGLE BATTLE ARENA", W / 2, 120);
    ctx.fillStyle = "#e0e0e0"; ctx.font = "18px Helvetica";
    ctx.fillText("Step 1 / 2 — Select Control Mode", W / 2, 165);

    const bw = Math.min(320, W * 0.36), bh = 100;
    const kbX = W / 2 - bw - 30, kbY = 230;
    this.drawChoiceBox(kbX, kbY, bw, bh, "#ff2e63", "KEYBOARD + MOUSE",
      ["WASD / Space — move & dash", "Left Click fire · E rocket",
       "C beam · Q shield · F strike · R lockon · G fake · H help"]);
    this.buttons.push({ x: kbX, y: kbY, w: bw, h: bh,
      action: () => { this.touchMode = false; this.state = "difficulty"; } });

    const tcX = W / 2 + 30, tcY = 230;
    this.drawChoiceBox(tcX, tcY, bw, bh, "#00fff5", "TOUCHSCREEN",
      ["Left joystick — move", "Right joystick — aim & fire", "Tap icons top-right for skills"]);
    this.buttons.push({ x: tcX, y: tcY, w: bw, h: bh,
      action: () => { this.touchMode = true; this.state = "difficulty"; } });
  }

  drawChoiceBox(x, y, w, h, borderColor, title, sublines) {
    ctx.fillStyle = "#1a1a2e"; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = borderColor; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = borderColor; ctx.font = "bold 16px Helvetica";
    ctx.fillText(title, x + w / 2, y + 32);
    ctx.fillStyle = "#888"; ctx.font = "11px Helvetica";
    sublines.forEach((s, i) => ctx.fillText(s, x + w / 2, y + 56 + i * 16));
  }

  drawDifficultySelect() {
    this.buttons = [];
    ctx.textAlign = "center";
    ctx.fillStyle = "#00fff5"; ctx.font = "bold 30px Helvetica";
    ctx.fillText("Step 2 / 2 — Select Difficulty", W / 2, 60);
    ctx.fillStyle = "#888"; ctx.font = "13px Helvetica";
    ctx.fillText(`Control: ${this.touchMode ? "TOUCHSCREEN" : "KEYBOARD + MOUSE"}  |  Marks: ${this.marks}`, W / 2, 82);

    const keys = ["news", "battlers", "master", "hell"];
    const gap = 16;
    const marginX = Math.max(15, W * 0.03);
    const usable = W - marginX * 2 - gap * 3;
    const bw = Math.min(220, usable / 4);
    const bh = Math.min(200, H * 0.38);
    const totalW = bw * 4 + gap * 3;
    const startX = (W - totalW) / 2;
    const startY = Math.min(H * 0.2, 110);

    keys.forEach((key, idx) => {
      const d = DIFFICULTIES[key];
      const x = startX + idx * (bw + gap);
      this.drawDifficultyBox(x, startY, bw, bh, d);
      this.buttons.push({ x, y: startY, w: bw, h: bh,
        action: () => this.startGame(this.touchMode, key) });
    });

    const shopW = 220, shopH = 60;
    const shopX = (W - shopW) / 2;
    const shopY = startY + bh + 30;
    ctx.fillStyle = "#2a1a3e"; ctx.fillRect(shopX, shopY, shopW, shopH);
    ctx.strokeStyle = "#c77dff"; ctx.lineWidth = 2; ctx.strokeRect(shopX, shopY, shopW, shopH);
    ctx.fillStyle = "#c77dff"; ctx.font = "bold 20px Helvetica";
    ctx.fillText("🛒  SHOP", shopX + shopW / 2, shopY + 28);
    ctx.fillStyle = "#888"; ctx.font = "11px Helvetica";
    ctx.fillText("Exchange marks for skills", shopX + shopW / 2, shopY + 48);
    this.buttons.push({ x: shopX, y: shopY, w: shopW, h: shopH,
      action: () => { this.state = "shop"; } });
  }

  drawDifficultyBox(x, y, w, h, d) {
    ctx.fillStyle = "#15152a"; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = d.color; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = d.color; ctx.font = "bold 22px Helvetica";
    ctx.fillText(d.name, x + w / 2, y + 42);
    ctx.fillStyle = "#aaa"; ctx.font = "12px Helvetica";
    ctx.fillText(d.subtitle, x + w / 2, y + 62);
    ctx.fillStyle = "#ccc"; ctx.font = "11px Helvetica";
    const descLines = this.wrapText(d.desc, w - 20);
    descLines.forEach((line, i) => ctx.fillText(line, x + w / 2, y + 88 + i * 14));
  }

  drawShop() {
    this.buttons = [];
    ctx.textAlign = "center";
    ctx.fillStyle = "#c77dff"; ctx.font = "bold 30px Helvetica";
    ctx.fillText("SHOP", W / 2, 50);
    ctx.fillStyle = "#aaa"; ctx.font = "14px Helvetica";
    ctx.fillText(`Marks: ${this.marks}  |  Equipped: ${this.equippedSkills.length}/${MAX_EQUIPPED}`, W / 2, 76);

    const keys = ["shield", "strike", "lockon", "fake", "help"];
    const gap = 14;
    const marginX = Math.max(12, W * 0.02);
    const usable = W - marginX * 2 - gap * 4;
    const bw = Math.min(170, usable / 5);
    const bh = Math.min(260, H * 0.5);
    const totalW = bw * 5 + gap * 4;
    const startX = (W - totalW) / 2;
    const startY = Math.min(H * 0.22, 100);

    keys.forEach((key, idx) => {
      const s = SKILLS[key];
      const x = startX + idx * (bw + gap);
      const owned = this.ownedSkills[key];
      const equipped = this.equippedSkills.includes(key);
      const canAfford = this.marks >= s.cost;

      ctx.fillStyle = equipped ? "#1a3a2a" : (owned ? "#1a2a3a" : "#15152a");
      ctx.fillRect(x, startY, bw, bh);
      ctx.strokeStyle = equipped ? "#06d6a0" : (owned ? "#00fff5" : "#c77dff");
      ctx.lineWidth = 3; ctx.strokeRect(x, startY, bw, bh);

      this.drawSkillIcon(x + bw / 2, startY + 70, 35, key);

      ctx.fillStyle = "#c77dff"; ctx.font = "bold 16px Helvetica";
      ctx.fillText(s.name, x + bw / 2, startY + bh - 90);

      if (owned) {
        if (equipped) {
          ctx.fillStyle = "#06d6a0"; ctx.font = "bold 12px Helvetica";
          ctx.fillText("✓ EQUIPPED", x + bw / 2, startY + bh - 60);
          ctx.fillStyle = "#888"; ctx.font = "10px Helvetica";
          ctx.fillText("tap to unequip", x + bw / 2, startY + bh - 45);
          this.buttons.push({ x, y: startY, w: bw, h: bh,
            action: () => {
              this.equippedSkills = this.equippedSkills.filter(k => k !== key);
            }});
        } else {
          ctx.fillStyle = "#00fff5"; ctx.font = "bold 12px Helvetica";
          ctx.fillText("TAP TO EQUIP", x + bw / 2, startY + bh - 60);
          this.buttons.push({ x, y: startY, w: bw, h: bh,
            action: () => {
              if (this.equippedSkills.length >= MAX_EQUIPPED) return;
              this.equippedSkills.push(key);
            }});
        }
      } else {
        ctx.fillStyle = canAfford ? "#ffd166" : "#666";
        ctx.font = "bold 13px Helvetica";
        ctx.fillText(`Buy — ${s.cost}`, x + bw / 2, startY + bh - 60);
        if (canAfford) {
          this.buttons.push({ x, y: startY, w: bw, h: bh,
            action: () => {
              if (this.marks >= s.cost && !this.ownedSkills[key]) {
                this.marks -= s.cost;
                this.ownedSkills[key] = true;
              }
            }});
        }
      }
    });

    if (this.equippedSkills.length >= MAX_EQUIPPED) {
      ctx.fillStyle = "#ff9f1c"; ctx.font = "12px Helvetica";
      ctx.fillText("Max equipped — unequip a skill to equip another", W / 2, startY + bh + 15);
    }

    const backW = 180, backH = 50;
    const backX = (W - backW) / 2;
    const backY = startY + bh + 40;
    ctx.fillStyle = "#1a1a2e"; ctx.fillRect(backX, backY, backW, backH);
    ctx.strokeStyle = "#ff2e63"; ctx.lineWidth = 2; ctx.strokeRect(backX, backY, backW, backH);
    ctx.fillStyle = "#ff2e63"; ctx.font = "bold 16px Helvetica";
    ctx.fillText("← BACK", backX + backW / 2, backY + 32);
    this.buttons.push({ x: backX, y: backY, w: backW, h: backH,
      action: () => { this.state = "difficulty"; } });
  }

  drawSkillIcon(cx, cy, r, key) {
    ctx.save();
    ctx.strokeStyle = "#dddddd"; ctx.fillStyle = "#dddddd"; ctx.lineWidth = 3;
    const s = r;
    if (key === "shield") {
      ctx.beginPath();
      ctx.moveTo(cx, cy - s);
      ctx.lineTo(cx + s * 0.7, cy - s * 0.4);
      ctx.lineTo(cx + s * 0.6, cy + s * 0.4);
      ctx.lineTo(cx, cy + s);
      ctx.lineTo(cx - s * 0.6, cy + s * 0.4);
      ctx.lineTo(cx - s * 0.7, cy - s * 0.4);
      ctx.closePath(); ctx.fill();
    } else if (key === "strike") {
      ctx.beginPath();
      ctx.moveTo(cx, cy - s);
      ctx.lineTo(cx + s * 0.4, cy);
      ctx.lineTo(cx, cy + s);
      ctx.lineTo(cx - s * 0.4, cy);
      ctx.closePath(); ctx.fill();
    } else if (key === "lockon") {
      ctx.beginPath(); ctx.arc(cx, cy, s * 0.7, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, s * 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx - s * 1.2, cy); ctx.lineTo(cx - s * 0.6, cy);
      ctx.moveTo(cx + s * 1.2, cy); ctx.lineTo(cx + s * 0.6, cy);
      ctx.moveTo(cx, cy - s * 1.2); ctx.lineTo(cx, cy - s * 0.6);
      ctx.moveTo(cx, cy + s * 1.2); ctx.lineTo(cx, cy + s * 0.6);
      ctx.stroke();
    } else if (key === "fake") {
      ctx.beginPath(); ctx.arc(cx, cy, s, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, s * 0.55, 0, Math.PI * 2); ctx.stroke();
    } else if (key === "help") {
      for (let i = 0; i < 3; i++) {
        const a = i * Math.PI * 2 / 3 - Math.PI / 2;
        const px = cx + Math.cos(a) * s * 0.6;
        const py = cy + Math.sin(a) * s * 0.6;
        ctx.beginPath(); ctx.arc(px, py, s * 0.25, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
  }

  wrapText(text, maxWidth) {
    const lines = [];
    let cur = "";
    for (const ch of text) {
      const test = cur + ch;
      if (ctx.measureText(test).width > maxWidth && cur) {
        lines.push(cur); cur = ch;
      } else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  }
}

// ===================== INPUT WIRING =====================
const game = new Game();

function idFor(e) { return (e.pointerType === "touch" || e.pointerType === "pen") ? "t" + e.pointerId : "mouse"; }
function getXY(e) { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }

canvas.addEventListener("pointerdown", e => {
  e.preventDefault();
  const [x, y] = getXY(e);
  game.onPointerDown(idFor(e), x, y);
  if (e.pointerType === "mouse") game.mousePos = [x, y];
}, { passive: false });

canvas.addEventListener("pointermove", e => {
  const [x, y] = getXY(e);
  game.onPointerMove(idFor(e), x, y);
}, { passive: false });

canvas.addEventListener("pointerup",     e => { game.onPointerUp(idFor(e)); }, { passive: false });
canvas.addEventListener("pointercancel", e => { game.onPointerUp(idFor(e)); }, { passive: false });

canvas.addEventListener("touchstart", e => e.preventDefault(), { passive: false });
canvas.addEventListener("touchmove",  e => e.preventDefault(), { passive: false });

window.addEventListener("keydown", e => {
  game.onKey(e.key, true);
  if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(e.key.toLowerCase())) e.preventDefault();
});
window.addEventListener("keyup", e => game.onKey(e.key, false));

canvas.addEventListener("contextmenu", e => {
  e.preventDefault();
  if (game.state === "playing" && !game.touchMode && game.player && game.player.isAlive && !game.player.isStriking) {
    game.redRockets.push(...game.player.fireRockets(game.enemies));
  }
});

// ===================== MAIN LOOP =====================
let last = performance.now();
function loop(t) {
  last = t;
  game.update();
  game.draw();
  requestAnimationFrame(loop);
}
resize();
requestAnimationFrame(loop);
</script>
